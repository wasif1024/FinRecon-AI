id: resolution
version: v3
status: draft  # draft | released
description: Proposes one resolution for a case from its recorded findings and applicable policy (SRS 7.5, FR-10).

model: claude-opus-5-5
effort: high
max_tokens: 16000
max_turns: 8

system: system.md
output_schema: resolution_proposal

tools:
  - get_case
  - get_case_transactions
  - get_case_findings
  - find_similar_cases
  - search_policies

subagents:
  - name: policy-researcher
    description: >-
      Finds the policy passages that govern this kind of resolution (thresholds, required documentation,
      approvals, escalation). Give it the exception type, the resolution you are considering and the question.
    system: policy_researcher.md
    max_turns: 6
    model: claude-haiku-5-5
    effort: medium
    tools:
      - search_policies

memory:
  - AGENTS.md

skills:
  - fee-discrepancy
  - short-bank-credit
  - missing-records
  - late-credit
  - reference-errors
  - currency-mismatch
  - duplicates
  - anomaly-indicators

changelog:
  - version: v1
    notes: Initial resolution prompt.
  - version: v2
    notes: >-
      Runs as a Deep Agent (LangChain + LangGraph) on ChatAnthropic: planning (write_todos), run-scoped scratch
      files, and focused subagents with their own tool allow-lists. Case instructions unchanged from v1.
  - version: v3
    notes: >-
      Deep Agents standards from Deep-Sales-Assistant: shared rules moved to an operating-manual memory
      (_memory/AGENTS.md), one playbook skill per exception category, subagents on Claude Haiku 5.5, and a
      per-case workspace (LangSmith sandbox) whose working papers carry across rounds.
