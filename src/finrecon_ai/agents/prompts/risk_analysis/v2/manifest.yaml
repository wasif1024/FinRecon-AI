id: risk_analysis
version: v2
status: draft  # draft | released
description: Assesses anomaly and duplicate indicators on a case and recommends whether to refer it (SRS 7.4).

model: claude-opus-5-5
effort: high
max_tokens: 16000
max_turns: 10

system: system.md
output_schema: risk_assessment

tools:
  - get_case
  - get_case_transactions
  - get_case_findings
  - search_transactions
  - get_counterparty_history
  - find_similar_cases
  - search_policies

subagents:
  - name: pattern-analyst
    description: >-
      Examines a counterparty's usual behaviour, related transactions the engine did not group, and similar past
      cases with their outcomes. Give it the counterparty, amounts, dates and the indicator to examine.
    system: pattern_analyst.md
    max_turns: 8
    tools:
      - get_counterparty_history
      - search_transactions
      - find_similar_cases

changelog:
  - version: v1
    notes: Initial risk analysis prompt.
  - version: v2
    notes: >-
      Runs as a Deep Agent (LangChain + LangGraph) on ChatAnthropic: planning (write_todos), run-scoped scratch
      files, and focused subagents with their own tool allow-lists. Case instructions unchanged from v1.
