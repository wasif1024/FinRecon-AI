id: investigation
version: v2
status: released  # draft | released
description: Investigates one reconciliation case and reports facts, hypotheses and a next action (FR-06).

model: claude-opus-5-5
effort: high  # Opus 5.5 defaults to medium; investigation is reasoning-heavy
max_tokens: 16000
max_turns: 12

system: system.md
output_schema: investigation_report

tools:
  - get_case
  - get_case_transactions
  - get_match_explanation
  - search_transactions
  - get_counterparty_history
  - find_similar_cases
  - search_policies

subagents:
  - name: transaction-tracer
    description: >-
      Traces money across gateway, settlement and bank records: finds the counterpart of an unmatched record
      under a different reference, date or amount, and summarises a counterparty's usual behaviour. Give it the
      amounts, currency, references, dates and counterparty.
    system: transaction_tracer.md
    max_turns: 8
    tools:
      - search_transactions
      - get_counterparty_history
      - get_match_explanation
  - name: policy-researcher
    description: >-
      Finds the policy passages that govern this kind of exception (thresholds, required documentation,
      approvals, escalation). Give it the exception type and the question to answer.
    system: policy_researcher.md
    max_turns: 6
    tools:
      - search_policies

changelog:
  - version: v1
    notes: Initial investigation prompt. Money-flow context moved to a shared fragment; policy search added.
  - version: v2
    notes: >-
      Runs as a Deep Agent (LangChain + LangGraph) on ChatAnthropic: planning (write_todos), run-scoped scratch
      files, and focused subagents with their own tool allow-lists. Case instructions unchanged from v1.
