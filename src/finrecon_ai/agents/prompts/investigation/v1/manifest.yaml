id: investigation
version: v1
status: draft  # draft | released
description: Investigates one reconciliation case and reports facts, hypotheses and a next action (FR-06).

model: claude-opus-5-5
effort: high  # Opus 5.5 defaults to medium; investigation is reasoning-heavy
max_tokens: 16000
max_turns: 12

system: system.md
output_schema: investigation_report

tools:
  - get_case
  - get_case_transactions
  - get_match_explanation
  - search_transactions
  - get_counterparty_history
  - find_similar_cases
  - search_policies

changelog:
  - version: v1
    notes: Initial investigation prompt.
