syntax = "proto3";

package finrecon.v1;

// Domain enums. Each value is the database enum's value in upper case behind the enum's prefix
// (CASE_STATUS_AWAITING_APPROVAL is "awaiting_approval"); tests/test_rpc.py checks they stay in step.
// UNSPECIFIED means "not set" in requests and never appears in responses for a required field.

enum CaseStatus {
  CASE_STATUS_UNSPECIFIED = 0;
  CASE_STATUS_NEW = 1;
  CASE_STATUS_INVESTIGATING = 2;
  CASE_STATUS_AWAITING_EVIDENCE = 3;
  CASE_STATUS_AWAITING_APPROVAL = 4;
  CASE_STATUS_APPROVED = 5;
  CASE_STATUS_REJECTED = 6;
  CASE_STATUS_RESOLVED = 7;
  CASE_STATUS_CLOSED = 8;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
  SEVERITY_CRITICAL = 4;
}

enum ClosureReason {
  CLOSURE_REASON_UNSPECIFIED = 0;
  CLOSURE_REASON_RESOLVED = 1;
  CLOSURE_REASON_FALSE_POSITIVE = 2;
  CLOSURE_REASON_NOT_ACTIONABLE = 3;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DEBIT = 1;
  DIRECTION_CREDIT = 2;
}

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_BANK_STATEMENT = 1;
  SOURCE_TYPE_PAYMENT_GATEWAY = 2;
  SOURCE_TYPE_MERCHANT_SETTLEMENT = 3;
}

enum ExceptionCategory {
  EXCEPTION_CATEGORY_UNSPECIFIED = 0;
  EXCEPTION_CATEGORY_UNMATCHED = 1;
  EXCEPTION_CATEGORY_PARTIALLY_MATCHED = 2;
  EXCEPTION_CATEGORY_CONFIRMED_DUPLICATE = 3;
  EXCEPTION_CATEGORY_POTENTIAL_DUPLICATE = 4;
  EXCEPTION_CATEGORY_AMOUNT_MISMATCH = 5;
  EXCEPTION_CATEGORY_DATE_MISMATCH = 6;
  EXCEPTION_CATEGORY_CURRENCY_MISMATCH = 7;
  EXCEPTION_CATEGORY_FEE_DISCREPANCY = 8;
  EXCEPTION_CATEGORY_MISSING_SETTLEMENT = 9;
  EXCEPTION_CATEGORY_ANOMALY = 10;
}

enum EvidenceType {
  EVIDENCE_TYPE_UNSPECIFIED = 0;
  EVIDENCE_TYPE_TRANSACTION = 1;
  EVIDENCE_TYPE_POLICY_PASSAGE = 2;
  EVIDENCE_TYPE_SUPPORTING_DOCUMENT = 3;
  EVIDENCE_TYPE_HISTORICAL_CASE = 4;
  EVIDENCE_TYPE_ANALYST_NOTE = 5;
}

enum FindingType {
  FINDING_TYPE_UNSPECIFIED = 0;
  FINDING_TYPE_VERIFIED_FACT = 1;
  FINDING_TYPE_HYPOTHESIS = 2;
  FINDING_TYPE_OUTSTANDING_REQUIREMENT = 3;
}

enum ResolutionType {
  RESOLUTION_TYPE_UNSPECIFIED = 0;
  RESOLUTION_TYPE_CONFIRM_FEE_DISCREPANCY = 1;
  RESOLUTION_TYPE_REQUEST_DOCUMENTATION = 2;
  RESOLUTION_TYPE_INVESTIGATE_DUPLICATE = 3;
  RESOLUTION_TYPE_ESCALATE = 4;
  RESOLUTION_TYPE_MANUAL_MATCH = 5;
  RESOLUTION_TYPE_NO_ACTION_REQUIRED = 6;
}

enum RecommendationStatus {
  RECOMMENDATION_STATUS_UNSPECIFIED = 0;
  RECOMMENDATION_STATUS_DRAFT = 1;
  RECOMMENDATION_STATUS_PENDING_APPROVAL = 2;
  RECOMMENDATION_STATUS_APPROVED = 3;
  RECOMMENDATION_STATUS_REJECTED = 4;
  RECOMMENDATION_STATUS_SUPERSEDED = 5;
  RECOMMENDATION_STATUS_EXECUTED = 6;
}

enum ApprovalRequestStatus {
  APPROVAL_REQUEST_STATUS_UNSPECIFIED = 0;
  APPROVAL_REQUEST_STATUS_PENDING = 1;
  APPROVAL_REQUEST_STATUS_DECIDED = 2;
  APPROVAL_REQUEST_STATUS_CANCELLED = 3;
}

enum ApprovalDecisionType {
  APPROVAL_DECISION_TYPE_UNSPECIFIED = 0;
  APPROVAL_DECISION_TYPE_APPROVE = 1;
  APPROVAL_DECISION_TYPE_REJECT = 2;
  APPROVAL_DECISION_TYPE_REQUEST_EVIDENCE = 3;
  APPROVAL_DECISION_TYPE_RETURN_FOR_INVESTIGATION = 4;
}
