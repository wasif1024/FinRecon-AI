name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The suite migrates and uses <database>_test as the owner (a non-superuser: superusers bypass row-level
      # security), and runs API requests as the application role finrecon_app via SET ROLE (tests/conftest.py).
      DATABASE_URL: postgresql+psycopg://finrecon:finrecon@localhost:5432/finrecon
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # No real keys: the tests never call Claude, send traces or create sandboxes.
      LANGSMITH_TRACING: "false"
      AGENT_WORKSPACE: state
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Create the application role and test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE finrecon LOGIN PASSWORD 'finrecon'"
          psql -h localhost -U postgres -c "CREATE DATABASE finrecon_test OWNER finrecon"
          psql -h localhost -U postgres -c "CREATE ROLE finrecon_app LOGIN PASSWORD 'finrecon_app' NOBYPASSRLS"
          psql -h localhost -U postgres -c "GRANT finrecon_app TO finrecon"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run langgraph validate
      - run: uv run pytest -q

  rpc:
    name: RPC contract (buf lint + generated code + breaking changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # buf breaking compares against main
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Lint proto/ and check the committed generated code is current
        run: scripts/gen-rpc.sh --check
      - name: No breaking changes against main
        if: github.event_name == 'pull_request'
        run: frontend/node_modules/.bin/buf breaking proto --against '.git#branch=origin/main,subdir=proto'

  docker:
    name: Docker (images + stack smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Environment for the stack (throwaway secrets; no API keys)
        run: |
          cp .env.example .env
          for key in POSTGRES_PASSWORD FINRECON_DB_PASSWORD FINRECON_APP_DB_PASSWORD JWT_SECRET; do
            sed -i "s|^$key=.*|$key=$(openssl rand -hex 32)|" .env
          done
          sed -i "s|^LANGSMITH_TRACING=.*|LANGSMITH_TRACING=false|; s|^AGENT_WORKSPACE=.*|AGENT_WORKSPACE=state|" .env
      - name: Build and start (migrations as the owner, then the API as finrecon_app, then the dashboard)
        run: docker compose --profile web up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/health
          curl -fsS -o /dev/null localhost:3000/login
          code=$(curl -s -X POST localhost:8000/finrecon.v1.CaseService/ListCases \
                 -H 'Content-Type: application/json' -d '{}' | jq -r .code)
          test "$code" = unauthenticated
          docker compose run --rm -T app db check   # the API's login reads and writes rows only
      - name: Logs
        if: failure()
        run: docker compose --profile web logs

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
