[project]
name = "finrecon-ai"
version = "0.1.0"
description = "Agentic AI platform for financial reconciliation, exception investigation and human-approved resolution."
authors = [
    { name = "wasif1024", email = "wasif1024@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "argon2-cffi>=25.1.0",
    "deepagents>=0.7.32",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "fpdf2>=2.9.0",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.16",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
finrecon = "finrecon_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "langgraph-cli[inmem]>=0.4.40",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Claude API (costs money); runs only with FINRECON_LIVE_TESTS=1",
]
filterwarnings = [
    # In-memory Qdrant (tests only) ignores payload indexes; the server uses them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
